<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLL &amp; OLL Time Attack</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "sortablejs": "https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/modular/sortable.esm.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/gh/acubemy/plugin-sdk@1/v1.js"></script>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Attack">
    <button role="tab" data-mode="PLL" aria-selected="true">PLL</button>
    <button role="tab" data-mode="OLL" aria-selected="false">OLL</button>
  </nav>
  <main>
    <section class="play">
      <p id="device" class="muted">No cube connected</p>
      <div class="stage">
        <div id="view"></div>
        <div id="celebrate" aria-hidden="true"></div>
      </div>
      <div id="timer">0.00</div>
      <p id="progress" class="muted">0 / 21</p>
      <p id="status"></p>
      <div class="buttons">
        <button id="restart" class="primary">Restart</button>
      </div>
    </section>
    <section class="table">
      <table>
        <thead>
          <tr>
            <th><button class="sort" data-key="split" data-no-arrow disabled>#</button></th>
            <th colspan="2"><button class="sort" id="case-header" data-key="name" disabled>PLL</button></th>
            <th class="time"><button class="sort" data-key="caseTime" disabled>Case</button></th>
            <th class="time"><button class="sort" data-key="split" disabled>Total</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
